{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EcoCart 🌿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .leaf-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.25;
            animation: floatLeaf 15s linear infinite;
        }
        @keyframes floatLeaf {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-emerald-50/60 via-green-50/40 to-teal-50/50 text-gray-800 relative overflow-x-hidden">

    <!-- Floating Leaf Background Particles -->
    <div class="leaf-particle text-3xl" style="left: 15%; animation-delay: 0s;">🍃</div>
    <div class="leaf-particle text-2xl" style="left: 45%; animation-delay: 5s;">🌿</div>
    <div class="leaf-particle text-4xl" style="left: 80%; animation-delay: 9s;">🌱</div>

    <!-- Header / Navbar -->
    <header class="bg-emerald-900/90 backdrop-blur-md border-b border-emerald-700/50 p-4 shadow-xl sticky top-0 z-40">
        <div class="container mx-auto flex items-center justify-between">
            <a href="{% url 'accounts:home' %}" class="flex items-center text-white group">
                <span class="font-bold text-3xl tracking-tight text-white flex items-center">
                    EcoCart <span class="ml-2 text-green-300 transform group-hover:rotate-12 transition-transform duration-300">🌿</span>
                </span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="{% url 'accounts:login' %}" class="text-white hover:text-emerald-200 font-semibold text-sm">Login</a>
                <a href="{% url 'accounts:register' %}" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-full text-white font-semibold text-sm shadow">Register</a>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 flex items-center justify-center relative z-10">
        <div class="w-full max-w-md bg-white/85 backdrop-blur-md p-8 md:p-10 rounded-3xl border border-emerald-100/80 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                    🔐
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Reset Password</h1>
                <p class="text-gray-600 text-sm">Enter your registered email address to receive reset instructions 🌱</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Password reset link sent to your email! 🌿');" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Email Address</label>
                    <input type="email" placeholder="you@example.com" required 
                           class="w-full px-4 py-3 bg-white border border-emerald-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg hover:shadow-xl transition duration-300 transform hover:scale-[1.02] text-base">
                    Send Reset Link 🌱
                </button>
            </form>

            <div class="text-center pt-2 border-t border-gray-100">
                <a href="{% url 'accounts:login' %}" class="text-emerald-700 font-bold text-sm hover:underline inline-block">&larr; Back to Login</a>
            </div>

        </div>
    </main>

    <footer class="bg-emerald-900 text-emerald-100 py-6 text-center border-t border-emerald-800 mt-auto text-xs font-medium">
        &copy; {% now "Y" %} EcoCart 🌱 &mdash; Built with sustainability in mind.
    </footer>

</body>
</html>
